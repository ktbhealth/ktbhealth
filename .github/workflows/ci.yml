name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Vite+ task runner: ci:* tasks live in vite.config.ts; ci:check and
      # ci:test depend on ci:build (it generates the paraglide output).
      - uses: actions/cache@v4
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            vp-task-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            vp-task-${{ runner.os }}-
      - run: bunx vp run ci:check
      - run: bunx vp run ci:test
      - run: bunx vp run ci:build
      - run: bunx vp run ci:route-types
      # Quick generated-file drift checks (no build needed): db schema
      # aggregator, drizzle/alchemy migrations, wrangler worker types.
      - run: bunx vp run ci:db-schema
      - run: bunx vp run ci:db-migrations
      - run: bunx vp run ci:worker-types
      # No build needed: knip is static analysis, check:arch is a fast
      # smoke test proving the ktb-arch boundary rules still fire.
      - run: bunx vp run ci:knip
      - run: bunx vp run ci:arch
