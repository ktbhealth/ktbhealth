apiVersion: 1

datasources:
  # The otel-lgtm image already ships Prometheus/Loki/Tempo datasources;
  # these entries pin the uids the KTB dashboard and alerts reference so
  # they stay stable across image upgrades.
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://localhost:3100
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://localhost:3200
    jsonData:
      # Trace→logs correlation: http.access / client.* records carry a
      # `traceId` attribute (32-hex OTel trace id) which lands in the JSON
      # log line; this extracts it for the "View matching logs" jump.
      derivedFields:
        - datasourceUid: loki
          matcherRegex: '"traceId":"([0-9a-f]{32})"'
          name: TraceID
          url: '$${__value.raw}'
