apiVersion: 1

datasources:
  # The otel-lgtm image already ships Prometheus/Loki/Tempo datasources;
  # these entries pin the uids the KTB dashboard and alerts reference so
  # they stay stable across image upgrades.
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://localhost:3100
    jsonData:
      # Log → trace correlation: Loki's OTLP endpoint stores each log
      # record's W3C trace context as the `trace_id` stream label /
      # structured metadata field. The label matcher turns it into a
      # "View trace" link on every correlated log line (Explore logs
      # pane and the Logs panel inside a Tempo trace view).
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: "View trace"
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://localhost:3200
    jsonData:
      # Trace → logs correlation: the "Logs for this span" panel queries
      # Loki filtered by the span's trace id, scoped to the service via
      # the service.name → service_name label mapping.
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: service.name
            value: service_name
