# Self-hosted LGTM backend for the KTB platform (P-066).
#
# Single `grafana/otel-lgtm` container: OpenTelemetry Collector +
# Prometheus + Loki + Tempo + Pyroscope + Grafana. See README.md for
# architecture, cloudflared tunnel setup and runbook.
#
# Image is pinned to a dated release tag — bump deliberately and re-test
# dashboards/alerts after upgrades (otelcol config below is version-coupled
# to the bundled collector).
name: ktb-lgtm

services:
  lgtm:
    image: grafana/otel-lgtm:0.40.0
    container_name: ktb-lgtm
    restart: unless-stopped
    env_file: .env
    environment:
      # Grafana hardening: no open sign-up; auth still required.
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Require login even on the tunnel-exposed UI (defense in depth
      # alongside Cloudflare Access).
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Prometheus retention args from .env (Loki/Tempo retention lives
      # in the mounted loki-config.yaml / tempo-config.yaml instead —
      # Loki 3.x has no retention CLI flag).
      PROMETHEUS_EXTRA_ARGS: ${PROMETHEUS_EXTRA_ARGS:-}
    ports:
      # Bind to loopback only — public exposure goes through cloudflared
      # (or an SSH tunnel for debugging). Never publish 9090/3100/3200/4317
      # without an auth decision.
      - "127.0.0.1:3000:3000" # Grafana UI
      - "127.0.0.1:4318:4318" # OTLP/HTTP (logs, traces, metrics)
      # - "127.0.0.1:4317:4317" # OTLP/gRPC — app only uses HTTP/JSON
    volumes:
      # All backends persist under /data.
      - lgtm-data:/data
      # Custom collector config — REPLACES the bundled default, so this
      # file must stay a superset of it (kept in sync with image 0.40.0).
      - ./otelcol-config.yaml:/otel-lgtm/otelcol-config.yaml:ro
      # Custom Loki/Tempo configs — supersets of the bundled defaults,
      # adding 7-day retention (compactor + limits_config /
      # block_retention). Same version-coupling caveat as otelcol.
      - ./loki-config.yaml:/otel-lgtm/loki-config.yaml:ro
      - ./tempo-config.yaml:/otel-lgtm/tempo-config.yaml:ro
      # Grafana provisioning (datasources, dashboards, alerting).
      - ./provisioning/datasources:/otel-lgtm/grafana/conf/provisioning/datasources:ro
      - ./provisioning/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards:ro
      - ./provisioning/alerting:/otel-lgtm/grafana/conf/provisioning/alerting:ro
    healthcheck:
      # The image drops /tmp/ready once every backend is up — cheaper and
      # more accurate than probing Grafana.
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits:
          # The all-in-one image is heavy (Prometheus+Loki+Tempo+Grafana);
          # size for the VM. 2 vCPU / 4 GiB is a sane floor for low traffic.
          cpus: "2.0"
          memory: 4G

  # ntfy — self-hosted alert notifications (replaces ntfy.sh; same
  # webhook contract, topic URL is still the only auth). Bound to
  # loopback; public exposure goes through cloudflared
  # (ktb-ntfy.luisfuturist.com -> localhost:8086). ~20 MB RAM.
  ntfy:
    image: binwiederhier/ntfy:v2.37.2
    container_name: ktb-ntfy
    restart: unless-stopped
    command: serve
    ports:
      - "127.0.0.1:8086:80"
    environment:
      NTFY_BASE_URL: ${NTFY_PUBLIC_URL:-http://localhost:8086}
      # Real auth: default-deny; users/topics are granted explicitly via
      # `ntfy user add` / `ntfy access` / `ntfy token add` (see README
      # "ntfy auth"). The auth DB persists on the ntfy-data volume.
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
    volumes:
      - ntfy-data:/var/lib/ntfy

  # Optional: run cloudflared as a compose service instead of installing
  # it on the host. Two modes:
  #
  #  A) Remotely-managed tunnel (recommended for IaC): create the tunnel in
  #     the CF dashboard/`cloudflared tunnel create`, copy the token into
  #     .env as CLOUDFLARED_TUNNEL_TOKEN, and manage ingress rules in the
  #     dashboard (or via API). Uncomment:
  #
  #  cloudflared:
  #    image: cloudflare/cloudflared:2025.11.1
  #    container_name: ktb-cloudflared
  #    restart: unless-stopped
  #    command: tunnel --no-autoupdate run
  #    environment:
  #      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN}
  #
  #  B) Locally-managed tunnel: keep cloudflared on the host with
  #     cloudflared/config.yml (see cloudflared/README notes in the main
  #     README) so ingress lives in git.

volumes:
  lgtm-data:
  ntfy-data:
