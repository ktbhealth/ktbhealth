# ktb — arca secret surface.
# Refs are committed; values live in the vault, never in the repo.
# Store with: printf '%s' "$VAL" | arca put arca://ktb/<name>

# Remote vault: self-hosted CF Worker + D1 (ktb account). Deployed
# from crates/arca-vault-cf/worker (9aia/arca).
[vaults.ktb]
kind = "cf"
url = "https://arca-vault.luisfuturist.workers.dev"
token_env = "ARCA_CF_TOKEN" # bearer fallback; scoped HMAC below

# Scoped token refs in the local vault — the ref path is the
# token_id the worker's ARCA_VAULT_TOKENS map keys on.
[vaults.ktb.tokens]
dev = "arca://ktb/cf-token-dev"
prod = "arca://ktb/cf-token-prod"

[envs]
prod = { vault = "ktb" }

[secrets]
# Note: `arca run` requires every declared ref to resolve. Keep
# cf-api-token commented until you `arca put` it — the alchemy
# profile already covers deploys.
# CLOUDFLARE_API_TOKEN = "arca://ktb/cf-api-token"
BETTER_AUTH_SECRET = "arca://ktb/better-auth-secret"
BETTER_AUTH_URL = "arca://ktb/better-auth-url"
